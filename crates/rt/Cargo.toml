[package]
name = "rt"
description = "review-tools command line: review sessions between coding agents and the people they work for."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rt-api.workspace = true
rt-client.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
humantime = "2.4.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
percent-encoding = "2"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3"
