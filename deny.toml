# cargo deny check: known advisories, licences and where crates come from. CI runs it on
# every push.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # unsafe-libyaml is unmaintained (no known vulnerability). It parses review documents'
    # front matter and decision blocks, through serde_yaml_ng; moving to a YAML parser in
    # safe Rust is its own change.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, not vulnerable; replacing serde_yaml_ng is separate work" },
]

[licenses]
# What the dependencies use today; a new licence fails the check until it is looked at.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # option-ext, through dirs: file-level copyleft, unmodified.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/gschjetne/rt-api"]
