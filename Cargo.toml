[workspace]
resolver = "3"
members = ["crates/rt-client", "crates/rt"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/gschjetne/rt-cli"

[workspace.dependencies]
rt-api = { git = "https://github.com/gschjetne/rt-api", tag = "v0.1.0" }
rt-client = { path = "crates/rt-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
